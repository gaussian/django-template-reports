[build-system]
requires = [
  "setuptools>=61.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "django-template-reports"
version = "0.5.2"
description = "Generates reports (PPTX) from template files that are flexibly populated using the Django ORM, without hard-coding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2.13,<6",
  "swapper>=1,<2",
  "office-templates>=0.5,<0.6",
]

[project.optional-dependencies]
xlsx = [
  "office-templates[xlsx]",
]

[project.urls]
Homepage = "https://github.com/gaussian/django-template-reports"
Issues = "https://github.com/gaussian/django-template-reports/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.10",
]

[tool.black]
line-length = 90
extend-exclude = '''
/migrations/
'''
force-exclude = '''
/migrations/
'''

[tool.isort]
profile = "black"

[tool.ruff.lint]
# Pin to the classic real-errors rule set (pyflakes + core pycodestyle) rather
# than ruff's newer, broader default which pulls in style/modernization rules.
# F401 (side-effect imports / re-exports look unused; F821 still catches
# genuinely-missing imports) and F841 (intentional unused locals) are excluded.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# __init__.py uses star imports to re-export the public API.
"__init__.py" = ["F403"]
